<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea un Formulario</title>
</head>
<body>
    <h1>Formulario de registro</h1>
    <form action="" method="get"> 
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required autofocus>
        <br><br>

        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" name="correo" required>
        <br><br>

        <label for="url">URL:</label>
        <input type="url" id="url" name="url" placeholder="Ingrese la URL aqui...">
        <br><br>

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha">
        <br><br>

        <label for="tiempo">Tiempo:</label>
        <input type="time" id="" name="" >
        <br><br>

        <label for="fechaHora">Fecha y hora:</label>
        <input type="datetime-local" id="fechaHora" name="fechaHora" >
        <br><br>

        <label for="mes">Mes:</label>
        <input type="month" id="mes" name="mes" >
        <br><br>

        <label for="semana">Semana:</label>
        <input type="week" id="semana" name="semana" >
        <br><br>

        <label for="numero">Número (min-10,max10):</label>
        <input type="number" id="numero" name="numero" min="-10" max="10" value="0" style="text-align: right;">
        <br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" max="12">
        <br><br>

        <label for="terminoBusqueda">Término de búsqueda:</label>
        <input type="search" id="terminoBusqueda" name="terminoBusqueda" >
        <br><br>

        <label for="color">Color favorito:</label>
        <input type="color" id="color" name="color">
        <br><br>

        <button type="submit" value="enviar">Enviar</button>
    </form>
</body>
</html>
