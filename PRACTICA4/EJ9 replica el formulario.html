<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro</title>
</head>
<body>
    <h1>Formulario de registro</h1>
    <form action="" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"><br><br>
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos"><br><br>
        <label for="sexo">Sexo:</label>
        <input type="radio" id="hombre" name="sexo" value="hombre">
        <label for="hombre">Hombre</label>
        <input type="radio" id="mujer" name="sexo" value="mujer" checked>
        <label for="mujer">Mujer</label>
        <br><br>
        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo"><br><br>
        <label for="poblacion">Población:</label>
        <select id="poblacion" name="poblacion">
            <option>Alicante</option>
        </select><br><br>
        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion" rows="5" cols="50"></textarea><br><br>
        <input type="checkbox" id="ofertas" name="ofertas">
        <label for="ofertas">Deseo recibir información sobre novedades y ofertas.</label><br><br>
        <input type="checkbox" id="politicas" name="politicas">
        <label for="politicas">Declaro haber leído y aceptar las condiciones generales del programa y la normativa sobre protección de datos.</label><br><br>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
