<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            color: Grey;
        }

        th, td {
        border: 1px solid Grey;
        padding: 12px 8px;
        text-align: left;
        }

    </style>
    <title>Tabla en HTML</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <td></td>
                <td colspan="2">Enero</td>
                <td colspan="2">Febrero</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="3">Datos Económicos</td>
                <td>Ingresos</td>
                <td>Gastos</td>
                <td>Ingresos</td>
                <td>Gastos</td>
            </tr>
           
            <tr>
                <td>1.000€</td>
                <td>700€</td>
                <td>1.100€</td>
                <td>580€</td>
            </tr>
            <tr>
                <td>1.800€</td>
                <td>920€</td>
                <td>1.750€</td>
                <td>920€</td>
            </tr>
           
        </tbody>
    </table>
</body>
</html>
