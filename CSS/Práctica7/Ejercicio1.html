<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replica el siguente texto en css</title>
    <style>
        span {
            color: green;
            text-decoration: underline;
        }
        #rojo{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        #negro{
            text-decoration:underline overline;
            color: black;
        }
        #grande{
            text-decoration: none;
            color: black;
            font-size: 30px;
            font-weight: bold;
        }
        #azul{
            color:blue;
            text-decoration: none;
            font-weight: bold;
            
        }
        #subrayadorojo{
            color:red;
            font-weight: bold;
        }
        
    </style>
</head>
<body>
    <p>En el momento en que <span>entiendo verdaderamente</span> a mi <span id="rojo">enemigo</span>, en el momento en que le <span id="negro">entiendo</span> lo
    suficientemente bien como para <span id="grande">derrotarle</span>, entonces, en ese preciso instante, <span id="azul">tambien le</span> <span id="subrayadorojo">quiero</span></p>
</body>
</html>
