<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realiza un menú como el siguiente con una lista</title>
    <style>
        nav{
            background-color: rgb(173, 132, 168);
            color: white;
            
        }
        ol{
            
            list-style-type: none;
            margin:0;
            padding:0;
            width:fit-content;
        }
        li{
            display: inline-block;
            padding: 10px;
            cursor: pointer;
            margin-top: 8px;
            margin-bottom: 8px;
            margin-left: 15px;
            
        }
        li:hover{
            background-color: blue;
            
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ol>
                <li>Inicio</li>
                <li>¿Quienes Somos?</li>
                <li>Contacto</li>
            </ol>
        </nav>
    </header>
</body>
</html>
