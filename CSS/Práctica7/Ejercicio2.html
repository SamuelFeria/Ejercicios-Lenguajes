<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realiza lo siguiente en CSS</title>
    <style>
        #marca:link{
            color:yellow;
        }
        #marca:hover{
            color:green;
        }
        #as:link{
            color:blueviolet;
        }
        #as:hover{
            color: red;
        }
        
    </style>
</head>

<body>
    <h1>Enlaces.link and hover</h1>
    <a id="marca" href="https://www.marca.com/">Ir a Marca</a><br>
    <a id="as" href="https://www.as.com/">Ir a AS</a>
</body>
</html>
