<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Representación cromática</title>
    <style>
        #contenedor{
            border: 1px solid black;
            
            
        }
        #contenedor div{
            background-color: rgb(255, 00, 64);
            border: 1px solid black;
            padding: 3%;
        
        }
        #contenedor>.color-2{
            background-color: rgba(255, 00, 64,0.9);
        }
        #contenedor>.color-3{
            background-color: rgba(255, 00, 64,0.8);
        }
        #contenedor>.color-4{
            background-color: rgba(255, 00, 64,0.7);
        }
        #contenedor>.color-5{
            background-color: rgba(255, 00, 64,0.6);
        }
        #contenedor>.color-6{
            background-color: rgba(255, 00, 64,0.5);
        }
        #contenedor>.color-7{
            background-color: rgba(255, 00, 64,0.4);
        }
        #contenedor>.color-8{
            background-color: rgba(255, 00, 64,0.3);
        }
        #contenedor>.color-9{
            background-color: rgba(255, 00, 64,0.2);
        }
        #contenedor>.color-10{
            background-color: rgba(255, 00, 64,0.1);
        }
        
    </style>
</head>
<body>
    <tbody>
        <div id="contenedor">
            <div class="color-1"></div>
            <div class="color-2"></div>
            <div class="color-3"></div>
            <div class="color-4"></div>
            <div class="color-5"></div>
            <div class="color-6"></div>
            <div class="color-7"></div>
            <div class="color-8"></div>
            <div class="color-9"></div>
            <div class="color-10"></div>
        </div>
    </tbody>
</body>
</html>
