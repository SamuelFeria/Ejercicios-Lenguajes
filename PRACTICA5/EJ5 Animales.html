<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animales</title>
</head>
<body>
    <header>
        <h1>Animales</h1>
        <nav>
            <a href="#leon">León</a> |
            <a href="#tigre">Tigre</a> |
            <a href="#cocodrilo">Cocodrilo</a> |
            <a href="#gorila">Gorila</a> |
            <a href="#zorzal">Zorzal</a>
        </nav>
    </header>
    <hr>
    <main>
        <section>
            <article id="leon">
                <h2>León</h2>
                <figure>
                    <img src="./IMG/Leon.webp" alt="Imagen de un león reflejado en el agua" width="300px">
                    <figcaption>León y su rugido característico.</figcaption>
                </figure>
                <audio controls >
                    <source src="./audio/leon.ogg" type="audio/ogg; codecs=opus">
                    <source src="./audio/leon.mp3" type="audio/mpeg">
                </audio>
            </article>
            <hr>
            <article id="tigre">
                <h2>Tigre</h2>
                <figure>
                    <img src="./IMG/tigre.webp" alt="Imagen de un tigre entre el césped" width="300px">
                    <figcaption>Tigre y su rugido característico.</figcaption>
                </figure>
                <audio controls>
                    <source src="./audio/tigre.mp3" type="audio/mpeg">
                </audio>
            </article>
            <hr>
            <article id="cocodrilo">
                <h2>Cocodrilo</h2>
                <figure>
                    <img src="./IMG/cocodrilo.jpg" alt="Imagen de un cocodrilo con la boca abierta" width="300px">
                    <figcaption>Cocodrilo y su sonido característico.</figcaption>
                </figure>
                <audio controls>
                    <source src="./audio/cocodrilo.mp3" type="audio/mpeg">
                </audio>
            </article>
            <hr>
            <article id="gorila">
                <h2>Gorila</h2>
                <figure>
                    <img src="./IMG/gorila.webp" alt="Imagen de un gorila sentado" width="300px">
                    <figcaption>Gorila y su rugido característico.</figcaption>
                </figure>
                <audio controls>
                    <source src="./audio/gorila.mp3" type="audio/mpeg">
                </audio>
            </article>
            <hr>
            <article id="zorzal">
                <h2>Zorzal</h2>
                <figure>
                    <img src="./IMG/zorzal.webp" alt="Imagen de un zorzal apoyado en una rama" width="300px">
                    <figcaption>Zorzal y su canto.</figcaption>
                </figure>
                <audio controls>
                    <source src="./audio/zorzal.mp3" type="audio/mpeg">
                </audio>
            </article>
        </section>
    </main>
</body>
</html>
