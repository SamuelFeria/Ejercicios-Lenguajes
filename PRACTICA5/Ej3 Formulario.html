<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario de registro</h1>
    <form action="" method="get">
        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre" name="nombre" required autofocus>
        <br>
        <br>
        <label for="correo">Correo electrónico: </label>
        <input type="email" id="correo" name="correo" requierd>
        <br>
        <br>
        <label for="url">URL:</label>
        <input type="url" id="url" name="url" placeholder="Escribe la URL">
        <br>
        <br>
        <label for="fecha">Fecha: </label>
        <input type="date" id="fecha" name="fecha">
        <br>
        <br>
        <label for="hora">Hora: </label>
        <input type="time" id="hora" name="hora">
        <br>
        <br>
        <label for="fechayhora">Fecha y hora: </label>
        <input type="datetime-local" id="fechayhora" name="fechayhora">
        <br>
        <br>
        <label for="mes">Mes: </label>
        <input type="month" id="mes" name="mes">
        <br>
        <br>
        <label for="semana">Semana: </label>
        <input type="week" id="semana" name="semana">
        <br>
        <br>
        <label for="numero">Número(entre -10y 10): </label>
        <input type="number" id="numero" name="numero" min="-10" max="10">
        <br>
        <br>
        <label for="telefono">Teléfono: </label>
        <input type="tel" id="telefono" name="telefono">
        <br>
        <br>
        <label for="busqueda">Términos de búsqueda: </label>
        <input type="search" id="busqueda" name="busqueda">
        <br>
        <br>
        <label for="color">Color favorito: </label>
        <input type="color" id="color" name="color">
        <br>
        <br>
        <button tpye="submit">Enviar</button>
    </form>
</body>
</html>
